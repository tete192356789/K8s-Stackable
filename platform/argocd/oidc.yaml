# ของที่ argocd-server ต้องใช้สำหรับ SSO ผ่าน Keycloak — kubectl apply ก่อน helm upgrade
#
# 1) Secret argocd-oidc: client secret ของ client "argocd" จาก OpenBao (secret/keycloak/clients, property argocd)
#    ต้องมี label app.kubernetes.io/part-of=argocd ไม่งั้น Argo CD อ้างถึงด้วย $argocd-oidc:clientSecret ไม่ได้
# 2) Certificate argocd-ca-trust: ใช้แค่ ca.crt ใน secret (= platform CA) ไป mount ให้ argocd-server เชื่อ Keycloak
#    cert-manager ต่ออายุให้เอง และถ้าสร้าง CA ใหม่ ca.crt ก็เปลี่ยนตาม — ไม่ต้องใส่ CA ลงใน Git
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: argocd-oidc
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: clientSecret
      remoteRef: { key: keycloak/clients, property: argocd }
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-ca-trust
  namespace: argocd
spec:
  secretName: argocd-ca-trust
  commonName: argocd-ca-trust
  dnsNames: [argocd-ca-trust.argocd.svc]
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: platform-ca
    kind: ClusterIssuer
    group: cert-manager.io
