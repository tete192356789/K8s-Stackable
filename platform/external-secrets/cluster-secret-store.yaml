# ClusterSecretStore ชี้ไปที่ OpenBao (ใช้ provider "vault" เพราะ OpenBao ใช้ API เดียวกับ Vault)
# ทุก namespace สร้าง ExternalSecret อ้างถึง store นี้ได้
# ESO ยืนยันตัวตนกับ OpenBao ด้วย ServiceAccount external-secrets (Kubernetes auth, role external-secrets)
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
