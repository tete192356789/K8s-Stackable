# Role + database ของ Superset บน pg-platform
# password อยู่ใน OpenBao: secret/postgres/superset (username, password)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-role-superset
  namespace: database
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: pg-role-superset
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef: { key: postgres/superset, property: username }
    - secretKey: password
      remoteRef: { key: postgres/superset, property: password }
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: superset
  namespace: database
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  name: superset
  owner: superset
  cluster:
    name: pg-platform
