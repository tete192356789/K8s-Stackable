# wave 10: PostgreSQL กลาง (CNPG Cluster pg-platform) + role / database ของแต่ละ service
# prune: false — ลบไฟล์ออกจาก Git แล้ว ArgoCD จะไม่ลบ database ให้ (กันข้อมูลหาย)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd
  annotations:
    # เทียบ diff ฝั่ง server รวมค่าเริ่มต้นที่ webhook (CNPG / Stackable / ESO) เติมให้ → ไม่ขึ้น OutOfSync ทั้งที่ไม่มีใครแก้
    argocd.argoproj.io/compare-options: ServerSideDiff=true
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://github.com/tete192356789/K8s-Stackable.git
    targetRevision: main
    path: gitops/postgres
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: database
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
