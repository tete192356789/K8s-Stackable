# Secret ทั้งหมดของ Harbor — ค่ามาจาก OpenBao ผ่าน ESO (ใน Git มีแค่ path)
# ต้องคงที่ทุกครั้งที่ Argo CD render chart (chart สุ่มค่าเองด้วย randAlphaNum ถ้าไม่ได้ให้ existing secret
# → เปลี่ยนทุก sync → Harbor ใช้งานไม่ได้) — โดยเฉพาะ secretKey ห้ามเปลี่ยนเลยหลังใช้งาน (ใช้เข้ารหัส credential ใน DB)
#
#   OpenBao secret/harbor/core       admin_password, secret_key (16), core_secret (16), csrf_key (32),
#                                    jobservice_secret (16), registry_http_secret (16)
#   OpenBao secret/harbor/registry   password, htpasswd (bcrypt ของ harbor_registry_user:<password>)
#   OpenBao secret/postgres/harbor   username, password
#   OpenBao secret/seaweedfs/s3-admin  access_key, secret_key
#   OpenBao secret/keycloak/clients  harbor
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-secrets
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: harbor-secrets
  data:
    - { secretKey: HARBOR_ADMIN_PASSWORD, remoteRef: { key: harbor/core, property: admin_password } }
    - { secretKey: secretKey, remoteRef: { key: harbor/core, property: secret_key } }
    - { secretKey: secret, remoteRef: { key: harbor/core, property: core_secret } }
    - { secretKey: CSRF_KEY, remoteRef: { key: harbor/core, property: csrf_key } }
    - { secretKey: JOBSERVICE_SECRET, remoteRef: { key: harbor/core, property: jobservice_secret } }
    - { secretKey: REGISTRY_HTTP_SECRET, remoteRef: { key: harbor/core, property: registry_http_secret } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-registry-credentials
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: harbor-registry-credentials
  data:
    - { secretKey: REGISTRY_PASSWD, remoteRef: { key: harbor/registry, property: password } }
    - { secretKey: REGISTRY_HTPASSWD, remoteRef: { key: harbor/registry, property: htpasswd } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-db
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: harbor-db
  data:
    - { secretKey: password, remoteRef: { key: postgres/harbor, property: password } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-s3
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: harbor-s3
  data:
    - { secretKey: REGISTRY_STORAGE_S3_ACCESSKEY, remoteRef: { key: seaweedfs/s3-admin, property: access_key } }
    - { secretKey: REGISTRY_STORAGE_S3_SECRETKEY, remoteRef: { key: seaweedfs/s3-admin, property: secret_key } }
---
# OIDC (Keycloak) แบบ declarative — Harbor อ่าน CONFIG_OVERWRITE_JSON ตอน start
# ผลข้างเคียง: config ทุกอย่างใน UI / API เป็น read-only (แก้ที่นี่แล้ว push + restart core แทน)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-oidc
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: harbor-oidc
    template:
      data:
        config.json: >-
          {"auth_mode": "oidc_auth",
           "primary_auth_mode": true,
           "oidc_name": "Keycloak",
           "oidc_endpoint": "https://keycloak.172.19.10.62.sslip.io/realms/platform",
           "oidc_client_id": "harbor",
           "oidc_client_secret": "{{ .clientSecret }}",
           "oidc_scope": "openid,profile,email,offline_access",
           "oidc_groups_claim": "groups",
           "oidc_admin_group": "platform-admins",
           "oidc_user_claim": "preferred_username",
           "oidc_verify_cert": true,
           "oidc_auto_onboard": true}
  data:
    - { secretKey: clientSecret, remoteRef: { key: keycloak/clients, property: harbor } }
---
# ca.crt (= platform CA) ให้ Harbor เชื่อ Keycloak — chart mount ที่ /harbor_cust_cert/custom-ca.crt
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbor-ca-trust
  namespace: harbor
spec:
  secretName: harbor-ca-trust
  commonName: harbor-ca-trust
  dnsNames: [harbor-ca-trust.harbor.svc]
  duration: 2160h
  renewBefore: 360h
  privateKey: { algorithm: ECDSA, size: 256 }
  issuerRef: { name: platform-ca, kind: ClusterIssuer, group: cert-manager.io }
---
# key + cert สำหรับเซ็น token ของ registry (core ↔ registry) — ใช้ cert-manager ให้คงที่
# (ไม่อย่างนั้น chart สร้าง CA ใหม่ทุกครั้งที่ render → token เก่าใช้ไม่ได้)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbor-core-token
  namespace: harbor
spec:
  secretName: harbor-core-token
  commonName: harbor-token-ca
  duration: 87600h                               # 10 ปี — หมดอายุ = token ใช้ไม่ได้
  privateKey: { algorithm: RSA, size: 4096, rotationPolicy: Never }
  issuerRef: { name: platform-ca, kind: ClusterIssuer, group: cert-manager.io }
