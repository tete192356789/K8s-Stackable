# Secret ของ MLflow — ค่ามาจาก OpenBao ผ่าน ESO
#   secret/postgres/mlflow       username, password      (db mlflow + mlflow_auth)
#   secret/seaweedfs/s3-admin    access_key, secret_key  (artifact ใน bucket mlflow)
#   secret/keycloak/clients      mlflow                  (client secret ของ client "mlflow")
#   secret/mlflow/app            secret_key              (เซ็น session ของปลั๊กอิน — คงที่ ไม่ให้ chart สุ่ม)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlflow-db
  namespace: mlflow
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: mlflow-db
  data:
    - { secretKey: username, remoteRef: { key: postgres/mlflow, property: username } }
    - { secretKey: password, remoteRef: { key: postgres/mlflow, property: password } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlflow-s3
  namespace: mlflow
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: mlflow-s3
  data:
    - { secretKey: AWS_ACCESS_KEY_ID, remoteRef: { key: seaweedfs/s3-admin, property: access_key } }
    - { secretKey: AWS_SECRET_ACCESS_KEY, remoteRef: { key: seaweedfs/s3-admin, property: secret_key } }
---
# env ที่เป็นความลับของปลั๊กอิน mlflow-oidc-auth (envFrom)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlflow-oidc-env
  namespace: mlflow
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: mlflow-oidc-env
    template:
      data:
        OIDC_CLIENT_SECRET: "{{ .clientSecret }}"
        SECRET_KEY: "{{ .secretKey }}"
        OIDC_USERS_DB_URI: "postgresql+psycopg2://mlflow:{{ .dbPassword }}@pg-platform-rw.database.svc.cluster.local:5432/mlflow_auth"
  data:
    - { secretKey: clientSecret, remoteRef: { key: keycloak/clients, property: mlflow } }
    - { secretKey: secretKey, remoteRef: { key: mlflow/app, property: secret_key } }
    - { secretKey: dbPassword, remoteRef: { key: postgres/mlflow, property: password } }
---
# ca.crt (= platform CA) ให้ MLflow เชื่อ cert ของ Keycloak (OIDC) — MLflow ไม่ได้ต่อ HTTPS ที่อื่น (S3 เป็น HTTP)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mlflow-ca-trust
  namespace: mlflow
spec:
  secretName: mlflow-ca-trust
  commonName: mlflow-ca-trust
  dnsNames: [mlflow-ca-trust.mlflow.svc]
  duration: 2160h
  renewBefore: 360h
  privateKey: { algorithm: ECDSA, size: 256 }
  issuerRef: { name: platform-ca, kind: ClusterIssuer, group: cert-manager.io }
