# Trino 481 (Stackable 26.7.0) — PoC
#   coordinator 1 + worker 1, ไม่มี authentication (PoC ช่วงแรก — เข้าถึงได้แค่ภายใน cluster / port-forward)
#   client ใช้ HTTP :8080 (ปิด server TLS) — การสื่อสารภายในระหว่าง coordinator กับ worker ยังใช้ TLS (SecretClass tls)
#   catalog: iceberg (Hive Metastore ผ่าน Thrift + SeaweedFS), tpch (ข้อมูลตัวอย่างสำหรับทดสอบ)
apiVersion: trino.stackable.tech/v1alpha1
kind: TrinoCluster
metadata:
  name: trino
  namespace: data-platform
spec:
  image:
    productVersion: "481"
  clusterConfig:
    catalogLabelSelector:
      matchLabels:
        trino: trino
    tls:
      serverSecretClass: null           # ปิด HTTPS ฝั่ง client — ต้องเปิดกลับตอนเพิ่ม authentication (Keycloak)
  coordinators:
    config:
      resources:
        cpu: { min: 250m, max: "1" }
        memory: { limit: 3Gi }
    roleGroups:
      default:
        replicas: 1
  workers:
    config:
      resources:
        cpu: { min: 500m, max: "2" }
        memory: { limit: 5Gi }
    roleGroups:
      default:
        replicas: 1
---
apiVersion: trino.stackable.tech/v1alpha1
kind: TrinoCatalog
metadata:
  name: iceberg
  namespace: data-platform
  labels:
    trino: trino
spec:
  connector:
    iceberg:
      metastore:
        configMap: hive                 # discovery ConfigMap ที่ HiveCluster "hive" สร้างให้ (thrift://hive-metastore:9083)
      s3:
        reference: seaweedfs            # S3Connection จาก gitops/hive/s3.yaml
---
apiVersion: trino.stackable.tech/v1alpha1
kind: TrinoCatalog
metadata:
  name: tpch
  namespace: data-platform
  labels:
    trino: trino
spec:
  connector:
    tpch: {}
