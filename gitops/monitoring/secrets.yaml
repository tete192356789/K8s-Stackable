# Secret ที่ Grafana และ Loki ต้องใช้ — มาจาก OpenBao ผ่าน ESO (ใน Git มีแค่ path)
#   grafana-admin     secret/grafana/admin           (admin-user, admin-password) — admin ภายในของ Grafana ไว้ใช้ตอน SSO เสีย
#   grafana-oidc      secret/keycloak/clients         property grafana — client secret ของ client "grafana" ใน Keycloak
#   loki-s3           secret/seaweedfs/s3-admin       access_key / secret_key — Loki เก็บ chunk + index ใน bucket "loki"
#   grafana-ca-trust  Certificate จาก platform-ca     ใช้แค่ ca.crt ให้ Grafana เชื่อ cert ของ Keycloak
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: grafana-admin
  data:
    - secretKey: admin-user
      remoteRef: { key: grafana/admin, property: admin-user }
    - secretKey: admin-password
      remoteRef: { key: grafana/admin, property: admin-password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: grafana-oidc
  data:
    - secretKey: client-secret
      remoteRef: { key: keycloak/clients, property: grafana }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-s3
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: loki-s3
  data:
    - secretKey: S3_ACCESS_KEY
      remoteRef: { key: seaweedfs/s3-admin, property: access_key }
    - secretKey: S3_SECRET_KEY
      remoteRef: { key: seaweedfs/s3-admin, property: secret_key }
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-ca-trust
  namespace: monitoring
spec:
  secretName: grafana-ca-trust
  commonName: grafana-ca-trust
  dnsNames: [grafana-ca-trust.monitoring.svc]
  duration: 2160h
  renewBefore: 360h
  privateKey: { algorithm: ECDSA, size: 256 }
  issuerRef: { name: platform-ca, kind: ClusterIssuer, group: cert-manager.io }
